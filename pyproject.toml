[project]
name = "boldr-intel"
version = "0.1.0"
description = "Boldr Customer Intelligence Engine — self-improving ticket triage + KB + marketing intel."
requires-python = ">=3.11,<3.14"
dependencies = [
    "anthropic>=0.40.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "chromadb>=0.5.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "streamlit>=1.30.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "markitdown[pdf]>=0.1.6",
]
